name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une PR qui pousse un correctif annule la CI de la version précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Les tests tournent sans navigateur : c'est le bénéfice direct de la
      # règle d'isolation de sim/. Pas de Playwright, pas de canvas, pas de
      # serveur X — quelques centaines de millisecondes.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
